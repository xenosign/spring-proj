spring.application.name=spring-proj
spring.output.ansi.enabled=always

# ECOS API KEY
exchange.api.key=${ECOS_API_KEY}
exchange.api.base.url=${ECOS_BASE_URL}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kakao Auth
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.client-authentication-method=${KAKAO_CLIENT_AUTHENTICATION_METHOD}
kakao.authorization-grant-type=${KAKAO_AUTHORIZATION_GRANT_TYPE}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.scope=${KAKAO_SCOPE}
kakao.client-name=${KAKAO_CLIENT_NAME}
kakao.authorization-uri=${KAKAO_AUTHORIZATION_URI}
kakao.token-uri=${KAKAO_TOKEN_URI}
kakao.user-info-uri=${KAKAO_USER_INFO_URI}
kakao.user-name-attribute=${KAKAO_USER_NAME_ATTRIBUTE}